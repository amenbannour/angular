<section class="notifications-card" id="notifications">
  <div class="notifications-icon">🔔</div>

  <div>
    <h2>Zone de notifications</h2>

    <p>
      Vous avez {{ notifications.length }} nouvelles notifications.
    </p>

    <button class="btn btn-outline-secondary"
            (click)="toggleNotifications()">
      {{ afficher ? 'Masquer les notifications' : 'Afficher les notifications' }}
    </button>

    @if (afficher) {
      <ul class="mt-3">
        @for (notification of notifications; track $index) {
          <li>{{ notification }}</li>
        }
      </ul>
    }
  </div>
</section>
